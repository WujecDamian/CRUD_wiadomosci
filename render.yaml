services:
  - type: web
    name: wiadomosci-api
    runtime: docker
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://wiadomosci.wujecdamian.dev
