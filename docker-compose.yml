services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messages
      POSTGRES_PASSWORD: messages
      POSTGRES_DB: messagesdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messages -d messagesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://messages:messages@db:5432/messagesdb?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  pgdata:
